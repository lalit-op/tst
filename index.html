<style id="assessbase-phone-nav">
@media (max-width: 650px) {
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .app { min-height: 100dvh; }
  .side {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    top: auto !important;
    width: 100% !important;
    height: calc(66px + env(safe-area-inset-bottom)) !important;
    padding: 6px 6px env(safe-area-inset-bottom) !important;
    border-right: 0 !important;
    border-top: 1px solid var(--line) !important;
    z-index: 100 !important;
    background: rgba(10,15,29,.96) !important;
    backdrop-filter: blur(16px);
    box-shadow: 0 -10px 30px rgba(0,0,0,.25);
  }

  .brand { display: none !important; }

  .nav {
    height: 100%;
    display: grid !important;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    align-items: stretch;
  }

  .nav button,
  .side.collapsed .nav button {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 3px !important;
    width: 100% !important;
    height: 58px !important;
    margin: 0 !important;
    padding: 5px 2px !important;
    border-radius: 10px !important;
    text-align: center !important;
    font-size: 10px !important;
    line-height: 1 !important;
    color: var(--muted) !important;
  }

  .nav button.active {
    color: #fff !important;
    background: var(--panel2) !important;
  }

  .nav-icon,
  .side.collapsed .nav-icon {
    display: block !important;
    width: auto !important;
    font-size: 20px !important;
    line-height: 22px !important;
  }

  .nav-label,
  .side.collapsed .nav-label {
    display: block !important;
    font-size: 9px !important;
    max-width: 58px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .main,
  .main.sidebar-collapsed {
    margin-left: 0 !important;
    width: 100% !important;
    max-width: none !important;
    padding: 14px 12px 20px !important;
  }

  .top {
    margin-bottom: 15px !important;
  }

  .top h1 { font-size: 24px !important; }
  .top p { font-size: 12px !important; }

  .actions { width: 100%; }
  .actions .btn { flex: 1 1 auto; }

  .card { padding: 14px !important; border-radius: 13px !important; }

  .test-grid, .grid, .results, .two {
    grid-template-columns: 1fr !important;
  }

  .question {
    padding: 15px !important;
    margin-bottom: 10px !important;
  }

  .qtext {
    font-size: 16px !important;
    line-height: 1.5 !important;
  }

  .option {
    min-height: 50px !important;
    padding: 12px !important;
    align-items: center !important;
  }

  .option input {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
  }

  .runnerbar {
    top: 0 !important;
    padding: 9px 0 !important;
  }

  .runnerbar .timer { font-size: 18px !important; }

  /* Keep runner controls easy to use above the bottom nav */
  .runner > .actions {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #0b1020ee;
    backdrop-filter: blur(10px);
    padding: 7px 0;
    margin-bottom: 8px !important;
  }

  .runner > .actions .btn {
    min-height: 44px;
    padding: 9px 8px;
  }

  .modal { padding: 10px !important; }
  .modalbox {
    max-height: calc(100dvh - 88px) !important;
    padding: 15px !important;
    border-radius: 14px !important;
  }

  .settings-card { padding: 15px !important; }
  .settings-grid { grid-template-columns: 1fr !important; }

  table { min-width: 620px; }
  .table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  input, select, textarea {
    font-size: 16px !important;
    min-height: 44px;
  }

  .drop { padding: 25px 12px !important; }

  /* Hide the desktop collapse affordance on phones */
  #brandToggle { display: none !important; }
}

@media (max-width: 380px) {
  .nav-label { font-size: 8px !important; }
  .nav-icon { font-size: 18px !important; }
  .main { padding-left: 9px !important; padding-right: 9px !important; }
}

/* AssessBase phone UX fixes */
@media (max-width: 650px) {
  /* Import/Export is intentionally kept out of the primary phone navigation. */
  .nav button[data-view="import"] {
    display: none !important;
  }

  .nav {
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
  }

  /* Don't force the history table to be wider than the phone. */
  .table {
    width: 100% !important;
    min-width: 0 !important;
    display: block !important;
    overflow: visible !important;
    white-space: normal !important;
  }

  .table thead {
    display: none !important;
  }

  .table tbody,
  .table tr {
    display: block !important;
    width: 100% !important;
  }

  .table tr {
    margin: 0 0 12px !important;
    padding: 12px !important;
    background: var(--panel2) !important;
    border: 1px solid var(--line) !important;
    border-radius: 13px !important;
  }

  .table td {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;

const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function norm(v){return String(v??'').trim().replace(/\s+/g,' ').toLowerCase()}

}
function optionsArray(o){if(Array.isArray(o))return o.map((v,i)=>({key:String.fromCharCode(65+i),text:v?.text??v?.label??v?.value??v}));if(o&&typeof o==='object')return Object.entries(o).map(([k,v])=>({key:k,text:v?.text??v?.label??v?.value??v}));return []}

// Clean SPA routing that works on both a GitHub Pages project site (/tst/)

function appBasePath(){

function renderDash(a){const n=state.attempts.length, scores=state.attempts.map(x=>x.scorePct).filter(Number.isFinite),avg=scores.length?scores.reduce((x,y)=>x+y,0)/scores.length:0,best=scores.length?Math.max(...scores):0;const last=[...state.attempts].sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt)).slice(0,8);a.innerHTML=header('Dashboard','Your GitHub-backed assessment workspace',`<button class="btn primary" data-action="go-import">+ Import Test</button>`)+`<div class="grid"><div class="card stat"><div class="label">Tests available</div><div class="value">${state.tests.length}</div></div><div class="card stat"><div class="label">Attempts stored</div><div class="value">${n}</div></div><div class="card stat"><div class="label">Average score</div><div class="value">${avg.toFixed(1)}%</div></div><div class="card stat"><div class="label">Best score</div><div class="value">${best.toFixed(1)}%</div></div></div><div class="section card"><h2>Recent attempts</h2>${last.length?attemptTable(last):'<div class="empty">No attempts yet. Import a test and take it.</div>'}</div>`}

px"><div class="card"><h2>Import JSON test</h2><div class="drop" id="drop">Drop a .json file here<br><small>or choose a file below</small><br><br><input type="file" id="file" accept=".json,application/json"></div><p class="notice">Supports raw question arrays, <b>{questions:[...]}</b>, test metadata, A/B/C/D option objects, option arrays, and common answer field names.</p></div><div class="card"><h2>Backup</h2><p class="notice">Export creates one JSON backup containing tests, questions, and every attempt. Import it later to restore your workspace.</p><div class="actions"><button class="btn primary" data-action="backup">Export full backup</button><button class="btn" data-action="restore">Import backup</button><input class="hidden" type="file" id="restoreFile" accept=".json"></div><hr style="border-color:var(--line);margin:22px 0"><button class="btn danger" data-action="wipe">Delete everything</button></div></div>`;const d=$('#drop'),f=$('#file');f.onchange=()=>readFile(f.files[0],false);['dragover','dragenter'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>readFile(e.dataTransfer.files[0],false))}

function ghHeaders(){const token=sessionStorage.getItem('assessbase_gh_token');const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(token)h.Authorization='Bearer '+token;return h}

function ghPath(parts){return parts.map(x=>String(x).split('/').map(encodeURIComponent).join('/')).join('/')}
function b64(s){return btoa(unescape(encodeURIComponent(s)))} function fromB64(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}

function parseAttemptTXT(text,item){
  const questions=[];
  const blocks=text.split(/\n(?=Q\d+\. )/).slice(1);
  blocks.forEach((block,i)=>{
    const lines=block.split('\n'); const qline=lines.shift()||''; const qm=qline.match(/^Q\d+\.\s*(.*)$/); if(!qm)return;
    const q={id:i+1,question:qm[1],options:[],marks:1,negativeMarks:0,answer:''};
    while(lines.length && !/^(Your Answer|Correct Answer|Result|Marks|Solution):/.test(lines[0])){const m=lines.shift().match(/^([A-H])\)\s*(.*)$/);if(m)q.options.push(m[2]);}
    const your=block.match(/Your Answer: ([^\n]*)/); const corr=block.match(/Correct Answer: ([^\n]*)/); const pts=block.match(/Marks: ([^\n]*)/); const sol=block.match(/Solution: ([\s\S]*?)(?=\n\n|$)/);
    q.answer=corr?corr[1].trim():''; q.explanation=sol?sol[1].trim():''; q.marks=pts&&Number(pts[1])>0?Number(pts[1]):1;
    questions.push(q);
  });
  return questions;
}
function attemptTXT(x){const qs=x.questions||[];const lines=['ASSESSBASE — FULL TEST + SOLUTIONS','=================================','Attempt ID: '+x.id,'Test: '+x.testName,'Exam: '+(x.exam||''),'Difficulty: '+(x.difficulty||''),'Started: '+x.startedAt,'Submitted: '+x.submittedAt,'Score: '+x.score+' / '+x.maxScore,'Percentage: '+x.scorePct.toFixed(2)+'%','Answered: '+x.answered+' / '+x.totalQuestions,'Correct: '+x.correct,'Time used: '+x.timeUsedSeconds+' seconds','','FULL TEST','========='];qs.forEach((q,i)=>{const d=(x.details||[])[i]||{};lines.push('Q'+(i+1)+'. '+q.question);if(q.options&&q.options.length)q.options.forEach((o,j)=>{const key=o&&typeof o==='object'&&o.key?o.key:String.fromCharCode(65+j);const text=o&&typeof o==='object'?(o.text??o.label??o.value??''):o;lines.push(key+') '+String(text));});lines.push('Your Answer: '+(d.answer===''?'Not answered':String(d.answer)));lines.push('Correct Answer: '+(q.answer==null?'Not provided':String(q.answer)));lines.push('Result: '+(d.correct===true?'CORRECT':d.correct===false?'INCORRECT':'NOT GRADED'));lines.push('Marks: '+d.points);if(q.explanation)lines.push('Solution: '+q.explanation);lines.push('');});return lines.join('\n')}

async function githubPut(path,content,message){const c=githubConfig();const token=sessionStorage.getItem('assessbase_gh_token');if(!c.owner||!c.repo)throw Error('Configure GitHub owner and repository first.');if(!token)throw Error('Enter a GitHub Personal Access Token in Settings.');const url=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${ghPath([path])}`;let sha;try{sha=(await ghRequest(url+'?ref='+encodeURIComponent(c.branch||'main'))).sha}catch(e){if(!/404|not found/i.test(String(e.message)))throw e}const body={message,content:b64(content),branch:c.branch||'main'};if(sha)body.sha=sha;return ghRequest(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function githubGetJSON(path,fallback){
  const c=githubConfig();
  const u=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${ghPath([path])}?ref=${encodeURIComponent(c.branch||'main')}`;
  try{return JSON.parse(fromB64((await ghRequest(u)).content))}
  catch(e){if(String(e.message).includes('404'))return fallback;throw e}
}

async function githubPullHistory(){
  const c=githubConfig();
  if(!c.owner||!c.repo)throw Error('Configure GitHub owner and repository first.');
  const folder=c.folder||'assessbase-history';
  const index=await githubGetJSON(`${folder}/index.json`,[]);
  state.attempts=[];
  for(const item of (Array.isArray(index)?index:[])){
    const fu=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${ghPath([folder,'attempts',item.id+'.txt'])}?ref=${encodeURIComponent(c.branch||'main')}`;
    try{

      const details=[...text.matchAll(/Your Answer: ([^\n]*)\nCorrect Answer: ([^\n]*)\nResult: (CORRECT|INCORRECT|NOT GRADED)\nMarks: ([^\n]*)/g)]
        .map(m=>({answer:m[1]==='Not answered'?'':m[1],correct:m[3]==='CORRECT'?true:m[3]==='INCORRECT'?false:null,points:Number(m[4])||0}));
      const questions=parseAttemptTXT(text,item);

}
async function githubDeleteFile(path,message){
  const c=githubConfig();
  const url=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${ghPath([path])}`;
  const existing=await ghRequest(url+'?ref='+encodeURIComponent(c.branch||'main'));

async function readFile(file,backup){
  if(!file)return;
  try{
    const text=await file.text(),data=JSON.parse(text);
    if(backup||data.__assessbaseBackup){
      if(!data.tests||!Array.isArray(data.attempts))throw Error('This backup is missing tests or attempts');
      state.tests=data.tests;
      await githubSaveTests();
      for(const x of data.attempts)await githubSaveAttempt(x);
      await githubPullHistory();
      toast(`Restored ${data.tests.length} tests and ${data.attempts.length} attempts to GitHub`);
      setView('dashboard');
      return;
    }
    const test=normalizeTest(data,file.name);
    if(!test.questions.length)throw Error('No usable questions found');
    state.tests.unshift(test);
    await githubSaveTests();
    toast(`Imported ${test.name} — ${test.questions.length} questions saved to GitHub`);
    setView('tests');
  }catch(e){alert('Import failed: '+e.message)}
}
function smartParseText(raw){
  const text=String(raw||'').replace(/\r/g,'').trim();
  if(!text)throw Error('Paste some questions first.');
  const lines=text.split('\n').map(x=>x.trim()).filter(Boolean);
  const starts=[]; lines.forEach((line,i)=>{if(/^(?:Q(?:uestion)?\s*)?\d+\s*[:.)-]/i.test(line))starts.push(i)});
  if(!starts.length)throw Error('No questions detected. Use Q1:, Q2:, or 1. numbering.');
  starts.push(lines.length); const questions=[];
  for(let z=0;z<starts.length-1;z++){
    const block=lines.slice(starts[z],starts[z+1]); let first=block.shift();
    const m=first.match(/^(?:Q(?:uestion)?\s*)?(\d+)\s*[:.)-]\s*(.*)$/i); let qtext=m?m[2]:first;
    const opts=[]; let answer='', explanation=''; let body=[];
    for(const line of block){
      let om=line.match(/^([A-H])\s*[).:-]\s*(.+)$/i); if(om){opts.push({key:om[1].toUpperCase(),text:om[2].trim()});continue}
      let am=line.match(/^(?:correct\s*)?(?:answer|ans)\s*[:=-]\s*(.+)$/i); if(am){answer=am[1].trim();continue}
      let em=line.match(/^(?:explanation|solution)\s*[:=-]\s*(.+)$/i); if(em){explanation=em[1].trim();continue}
      body.push(line);
    }
    if(body.length)qtext += (qtext?' ':'')+body.join(' ');
    if(answer){const ah=answer.match(/^([A-H])(?:[).:\s]|$)/i);if(ah)answer=ah[1].toUpperCase()}
    questions.push({id:z+1,subject:'General',type:opts.length?'MCQ':'TEXT',marks:1,negativeMarks:0,question:qtext,options:opts,answer,explanation});
  }
  return questions.filter(q=>q.question.trim());
}

async function submitRunner(auto=false){const r=state.runner;if(!r)return;clearInterval(startRunner.timer);let score=0,correct=0,answeredCount=0;const details=r.test.questions.map(q=>{const a=r.answers[q.id]??'';const was=answered(q,a);if(was)answeredCount++;const g=grade(q,a);let points=0;if(g===true){correct++;points=q.marks}else if(g===false)points=-q.negativeMarks;score+=points;return{questionId:q.id,answer:a,correct:g,points}});const max=r.test.totalMarks||r.test.questions.reduce((x,q)=>x+q.marks,0);const pct=Math.max(0,Math.min(100,score/max*100));const attempt={id:uid('attempt'),testId:r.test.id,testName:r.test.name,exam:r.test.exam,difficulty:r.test.difficulty,startedAt:new Date(Date.now()-(r.test.suggestedTime*60000-r.remaining*1000)).toISOString(),submittedAt:new Date().toISOString(),totalQuestions:r.test.questions.length,answered:answeredCount,correct,score,maxScore:max,scorePct:pct,timeUsedSeconds:(r.test.suggestedTime||Math.ceil(r.test.questions.length*1.5))*60-r.remaining,details,questions:r.test.questions.map(q=>({id:q.id,subject:q.subject,type:q.type,marks:q.marks,negativeMarks:q.negativeMarks,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation||'',image:q.image||''}))};let gh='';try{await githubSaveAttempt(attempt);state.attempts.push(attempt);gh=' · GitHub Database saved'}catch(e){console.warn('GitHub save failed',e);toast('Submission failed — nothing was saved locally');return}state.runner=null;toast((auto?'Time expired — test submitted':'Test submitted and saved')+gh);setView('history')}
function showModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hidden')};function closeModal(){$('#modal').classList.add('hidden')};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
async function actions(a,id){try{if(a==='go-import')setView('import');if(a==='smart-paste')await smartPasteGenerate();if(a==='manual-mcq')manualQuestion('MCQ');if(a==='manual-blank')manualQuestion('FILL');if(a==='manual-text')manualQuestion('TEXT');if(a==='manual-code')manualQuestion('CODE');if(a==='save-manual-question')saveManualQuestion(id);if(a==='save-draft-test')await saveDraftTest();if(a==='clear-draft'){state.draftQuestions=[];render();toast('Draft cleared')}if(a==='start-test'){const t=state.tests.find(x=>x.id===id);if(t)startRunner(t)}if(a==='runner-prev'){document.querySelectorAll('.question').forEach((x,i)=>{if(i===Math.max(0,state.runner.index-1))x.scrollIntoView({behavior:'smooth',block:'start'})});state.runner.index=Math.max(0,state.runner.index-1)}if(a==='runner-next'){state.runner.index=Math.min(state.runner.test.questions.length-1,state.runner.index+1);document.querySelectorAll('.question')[state.runner.index]?.scrollIntoView({behavior:'smooth',block:'start'})}if(a==='submit-runner'){if(confirm('Submit this test? Your answers will be permanently saved as an attempt.'))submitRunner(false)}if(a==='delete-attempt'){if(confirm('Delete this attempt permanently from GitHub?')){await githubDeleteAttempt(id);state.attempts=state.attempts.filter(x=>x.id!==id);render();toast('Attempt deleted from GitHub')}}if(a==='delete-test'){if(confirm('Delete this test permanently from GitHub? Existing attempts are kept.')){state.tests=state.tests.filter(x=>x.id!==id);await githubSaveTests();render();toast('Test deleted from GitHub')}}if(a==='test-info'){const t=state.tests.find(x=>x.id===id);showModal(`<h2>${esc(t.name)}</h2><p>${esc(t.exam)}</p><div class="notice">${t.questions.length} questions · ${t.totalMarks} marks · ${esc(t.difficulty)}${t.suggestedTime?' · '+t.suggestedTime+' min':''}</div><h3>Instructions</h3><ul>${t.instructions.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No instructions supplied.</li>'}</ul><button class="btn" onclick="closeModal()">Close</button>`) }if(a==='view-attempt'){const x=state.attempts.find(z=>z.id===id);if(!x)throw Error('Attempt not found');showModal(`<h2>${esc(x.testName)}</h2><p class="muted">${formatDate(x.submittedAt)} · ${x.scorePct.toFixed(1)}%</p><div class="sync-row"><button class="btn primary" data-action="simple-view" data-id="${x.id}">Simple View</button><button class="btn" data-action="copy-full-test" data-id="${x.id}">Copy Full Test + Solutions (.txt)</button></div>`)}if(a==='simple-view'){const x=state.attempts.find(z=>z.id===id);if(x)showModal(simpleAttemptHTML(x)+`<button class="btn" onclick="closeModal()">Close</button>`)}if(a==='copy-full-test'){const x=state.attempts.find(z=>z.id===id);if(!x)throw Error('Attempt not found');const text=attemptTXT(x);try{await navigator.clipboard.writeText(text);toast('Full test + solutions copied to clipboard — nothing was downloaded')}catch(e){showModal(`<h2>Copy Full Test + Solutions</h2><p>Clipboard access was blocked by the browser. Select and copy the text below.</p><textarea style="width:100%;min-height:420px;background:#0b1222;color:white;border:1px solid var(--line);padding:12px;border-radius:10px">${esc(text)}</textarea><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="this.previousElementSibling.select();document.execCommand('copy');toast('Copied to clipboard')">Copy</button><button class="btn" onclick="closeModal()">Close</button></div>`)}}if(a==='backup'){const data={__assessbaseBackup:true,version:2,exportedAt:new Date().toISOString(),source:'GitHub Database',tests:state.tests,attempts:state.attempts};download('assessbase-github-backup.json',JSON.stringify(data,null,2),'application/json')}if(a==='restore'){$('#restoreFile').click();$('#restoreFile').onchange=()=>readFile($('#restoreFile').files[0],true)}if(a==='export-attempts')download('assessbase-attempt-history.json',JSON.stringify(state.attempts,null,2),'application/json');if(a==='wipe'){if(confirm('This permanently deletes ALL tests and attempts from your GitHub repository. Continue?')){for(const x of [...state.attempts]){try{await githubDeleteAttempt(x.id)}catch(e){}}state.tests=[];state.attempts=[];await githubSaveTests();setView('import');toast('All GitHub database data deleted')}}if(a==='storage-test'){await githubPullTests();await githubPullHistory();toast('GitHub Database is reachable and loaded')}if(a==='save-app-settings'){saveAppSettings();render()}if(a==='clear-github-token'){sessionStorage.removeItem('assessbase_gh_token');if($('#ghToken'))$('#ghToken').value='';toast('GitHub token cleared')}if(a==='save-github'){saveGithubConfig();render()}if(a==='github-test'){saveGithubConfig();const c=githubConfig();const d=await ghRequest(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);toast(`Connected to ${d.full_name}`)}if(a==='github-pull'){await githubPullHistory()}}catch(e){alert(e.message)}}
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
(async()=>{await load()})();
</script></body></html>
